[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provtimerag"
version = "0.1.0"
description = "Structured claim-to-provenance-state assignment for trustworthy RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = []
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
data = [
  "pyarrow==25.0.0",
]
ml = [
  "torch>=2.4",
  "transformers>=4.44,<6",
  "requests>=2.32",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/provtimerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["provtimerag"]



